<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /*border:40px groove red;*/
            /* border-style:groove;/*
           /* align-content: center;*/
            /*background-image: url("m.jpeg");*/
            background-color: rgb(12, 11, 12);

        }

        header {
            background-color: yellow;
            display: flex;
            justify-content: space-between;
            height: 60px;
            align-items: center;
        }

        header nav {
            display: flex;
        }

        header nav li {
            list-style-type: none;
            margin-right: 20px;
            color: blue;
            font-size: 20px;
            cursor: pointer;
        }

        div header h1 {
            user-select: none;
            font-size: 50px;
        }

        .search-box {
            width: 200px;
        }

        .search-box input {
            width: 100%;
            height: 25px;
            outline: 0;
            color: blue;
            border: none;
            font: 20px;
            margin-right: 20px;
        }

        .search-box img {
            position: absolute;
            width: 30px;
            height: 25px;
            margin-left: 170px;
            top: 20px;
            display: flex;

        }

        button:hover {
            width: 50px;
            height: 30px;
            background-color: rgb(240, 15, 146);
            color: aliceblue;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        header div.material-symbols-outlined {
            font-size: 30px;
            color: blue;
            cursor: pointer;
            display: none;
        }


        @media screen and (max-width: 600px) {
           
             header nav{
                width:25%;
                height: 100vh;
                position: absolute;
                right: 0;
                top:60px;
                background-color:yellow;
                flex-direction: column;
                }


        }

        
    </style>
</head>

<body>

    <header>
        <h1>logo</h1>
        <nav>
            <li>Home</li>
            <li>videos</li>
            <li>songs</li>
            <li>abaue</li>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="search">
            <img src="aas.png" alt="">
        </div>
        <div>
            <button>click</button>
        </div>
        <div>
            <span class="material-symbols-outlined">
                menu
            </span>
        </div>
    </header>
</body>

</html>
